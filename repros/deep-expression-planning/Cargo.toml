# SPDX-License-Identifier: Apache-2.0
[package]
name = "deep-expression-planning"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "Apache-2.0"
description = "Planning-time reproducer for deeply nested computed sort/group keys in DataFusion"

# Exactly one DataFusion version is compiled per build, selected by feature.
# Both are pinned exactly and resolved in the one committed Cargo.lock.
[features]
default = ["df56"]
df55 = ["dep:datafusion55"]
df56 = ["dep:datafusion56"]

[dependencies]
datafusion55 = { package = "datafusion", version = "=55.0.0", optional = true }
datafusion56 = { package = "datafusion", version = "=56.0.0", optional = true }
tokio = { version = "1", features = ["rt"] }

[profile.release]
debug = "line-tables-only"
